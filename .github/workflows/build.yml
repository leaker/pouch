# =============================================================================
# Cross-platform build workflow for Pouch (Tauri v2 desktop app).
#
# What this workflow does
# -----------------------
#   - On push to `main` and on pull_request targeting `main`:
#       run a fast `cargo check` on macOS (Apple Silicon) and Windows runners.
#       No bundling, no signing, no notarization, no artifact upload, no
#       Release. This is purely a "does the tree still compile?" smoke test.
#
#   - On push of a tag matching `v*` (e.g. `v0.1.0`, `v1.2.3-rc1`) OR on
#       manual `workflow_dispatch`:
#       run the full release path: macOS universal-darwin build via
#       tauri-action with sign + notarize + .dmg bundling, Windows
#       `cargo build --release` + portable .exe / .zip staging, then create
#       a GitHub Release uploading both via `softprops/action-gh-release` in
#       a dedicated `release` job that runs after both builds finish.
#       (workflow_dispatch from a non-tag ref still produces artifacts but
#       skips the GitHub Release publish step.)
#
# Artifacts (final shape)
# -----------------------
# All artifacts share one filename pattern: `Pouch-<version>.<ext>` where
# <version> is the git tag with the leading `v` stripped (so `v1.0.0-rc1`
# becomes `1.0.0-rc1`). This means rc / beta builds never collide with the
# matching final release on the same Releases page, and there is no
# platform suffix to confuse downloaders -- the file extension already
# tells the user which platform a given artifact is for.
#
#   - macOS  (macos-latest, universal-apple-darwin):
#       * `Pouch-<version>.dmg`
#         Signed with Developer ID Application + notarized by Apple's
#         notary service. Built by `tauri-apps/tauri-action` under its
#         default `Pouch_<version>_universal.dmg` name and renamed to the
#         tag-bearing form by the workflow before upload-artifact.
#
#   - Windows (windows-latest, x86_64-pc-windows-msvc):
#       * `Pouch-<version>.exe`
#         The raw portable binary copied from
#         `src-tauri/target/release/pouch.exe`.
#       * `Pouch-<version>.zip`
#         A self-contained sample bundle with the layout:
#             pouch.exe
#             hook.conf.toml
#             inject/
#                 global.js
#                 leelib.js
#         The `overrides/` directory (which holds runtime-cached
#         resources at dev/run time) is intentionally NOT included --
#         shipping that data could leak local development state.
#
# Why we bypass tauri-action on Windows
# -------------------------------------
# Tauri's Windows bundler defaults to `.msi` (and optionally NSIS `.exe`
# installer). For Pouch we want a *portable* `.exe` and a self-contained
# `.zip` -- not an installer. Running `cargo build --release` directly inside
# `src-tauri/` produces exactly that, with no bundling overhead. tauri-action
# remains the right tool for macOS where signing + notarization is
# non-trivial to reimplement by hand.
#
# x86_64-mac (standalone), iOS and Android are intentionally out of scope
# for Pouch (see README §7 for the supported platform matrix).
#
# macOS code signing + notarization
# ---------------------------------
# We import an Apple Developer ID certificate into a temporary keychain on the
# runner before invoking tauri-action, then pass the Apple credentials through
# the environment so tauri-action notarizes the resulting .app/.dmg with
# Apple's notary service. Windows is *not* signed by this workflow.
#
# Required GitHub Secrets (Repo -> Settings -> Secrets and variables ->
# Actions -> New repository secret). The workflow will skip the macOS signing
# step gracefully if `APPLE_CERTIFICATE` is empty (e.g. on a fork's PR), but
# release builds without these secrets will produce unsigned artifacts that
# Gatekeeper will quarantine on end-user machines.
#
#   APPLE_CERTIFICATE
#       Base64-encoded .p12 file containing your "Developer ID Application"
#       certificate AND its private key. Export from Keychain Access ->
#       My Certificates, then:  base64 -i cert.p12 | pbcopy   (macOS)
#       Paste the resulting single-line string as the secret value.
#
#   APPLE_CERTIFICATE_PASSWORD
#       The password you set when exporting the .p12 above. Used by `security
#       import` to unlock the certificate.
#
#   APPLE_SIGNING_IDENTITY
#       The exact name of the codesigning identity, e.g.
#           "Developer ID Application: Jane Doe (ABCDE12345)"
#       Run `security find-identity -v -p codesigning` locally to copy it.
#       Tauri matches this string against the keychain to pick the cert.
#
#   APPLE_ID
#       Your Apple ID email address (the one enrolled in the Developer
#       Program). Used by the notary service for authentication.
#
#   APPLE_PASSWORD
#       An *app-specific password* generated at https://appleid.apple.com ->
#       Sign-In and Security -> App-Specific Passwords.  NOT your Apple ID
#       login password. Notarization will fail with a non-obvious 401 if you
#       use the regular password.
#
#   APPLE_TEAM_ID
#       Your 10-character Team ID (e.g. `ABCDE12345`), found at
#       https://developer.apple.com/account -> Membership. Required when
#       your Apple ID belongs to multiple teams; safe to always set.
#
#   KEYCHAIN_PASSWORD
#       Any random throwaway string. Used only to lock/unlock the temporary
#       build keychain we create on the runner; it never leaves the job.
#
#   PACKAGE_MANAGER_BUMP_TOKEN
#       Personal Access Token used only by the release job after the GitHub
#       Release assets are published. It pushes manifest updates to
#       leaker/homebrew-tap and leaker/scoop-bucket. Do not use the default
#       GITHUB_TOKEN for these downstream repos.
#
# Tooling versions are pinned to current stable major tags. Bump deliberately.
# =============================================================================

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only at the workflow level; the `release` job opts back in
# to `contents: write` when it needs to publish a Release.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Release version guard.
  #
  # A `vX.Y.Z` tag must point at a commit whose checked-in app metadata already
  # says `X.Y.Z`. This catches the failure mode where a tag is pushed without
  # first following RELEASING.md's version-bump step.
  # ---------------------------------------------------------------------------
  validate_release_version:
    name: Validate release version metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compare tag with checked-in version files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = os.environ["REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", tag):
              print(f"::error::Release tag must look like vX.Y.Z or vX.Y.Z-suffix, got {tag}")
              sys.exit(1)

          expected = tag.removeprefix("v")
          checks = []

          tauri_conf = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          checks.append(("src-tauri/tauri.conf.json", tauri_conf.get("version")))

          cargo_toml = tomllib.loads(Path("src-tauri/Cargo.toml").read_text())
          checks.append(("src-tauri/Cargo.toml", cargo_toml["package"].get("version")))

          cargo_lock = tomllib.loads(Path("src-tauri/Cargo.lock").read_text())
          pouch_packages = [
              package for package in cargo_lock.get("package", [])
              if package.get("name") == "pouch"
          ]
          if len(pouch_packages) != 1:
              print(f"::error::Expected exactly one pouch package in src-tauri/Cargo.lock, found {len(pouch_packages)}")
              sys.exit(1)
          checks.append(("src-tauri/Cargo.lock package pouch", pouch_packages[0].get("version")))

          failed = False
          for source, actual in checks:
              if actual != expected:
                  print(f"::error::{source} version {actual!r} does not match tag {tag} ({expected})")
                  failed = True
              else:
                  print(f"{source}: {actual}")

          if failed:
              sys.exit(1)
          print(f"All checked-in release version files match {tag}.")
          PY

  # ---------------------------------------------------------------------------
  # macOS build.
  #
  # Two modes, gated by the trigger:
  #   - main / PR  -> fast `cargo check` smoke test only (no bundle, no sign,
  #                   no notarize, no upload). Just confirms the tree compiles
  #                   on Apple Silicon.
  #   - v* tag / workflow_dispatch -> full release path: signed + notarized
  #                   .dmg via tauri-action, then upload-artifact for the
  #                   release job to pick up.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (.dmg)
    needs: [validate_release_version]
    if: ${{ always() && !cancelled() && (needs.validate_release_version.result == 'success' || needs.validate_release_version.result == 'skipped') }}
    runs-on: macos-latest

    # Hoist the cert secret to job-level env so the keychain step's `if:`
    # expression can detect when it's empty (forked PRs cannot read secrets,
    # and `secrets.*` is not allowed inside `if:`).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 Apple Darwin target
        # Only needed for the `--target universal-apple-darwin` release build.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache cargo registry/git AND the per-crate target directory.
          workspaces: './src-tauri -> target'

      # ----------------------------------------------------------------------
      # SMOKE-ONLY: `cargo check` on main push / PR. No bundling.
      # ----------------------------------------------------------------------
      - name: Cargo check (smoke)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        working-directory: src-tauri
        run: cargo check --locked

      # ----------------------------------------------------------------------
      # Import the Developer ID certificate into a fresh keychain so codesign
      # can find it during `tauri build`. Release-only.
      # ----------------------------------------------------------------------
      - name: Import Apple Developer certificate
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      # ----------------------------------------------------------------------
      # Build (and sign + notarize when secrets are present). tauri-action
      # handles bundling, signing (via APPLE_* env), and notarization. We do
      # NOT pass tagName/releaseName/releaseBody here -- the dedicated
      # `release` job below collects artifacts from upload-artifact and
      # publishes them in a single coordinated step.
      #
      # The TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] env pair is consumed by the
      # tauri bundler (only when bundle.createUpdaterArtifacts is true in
      # tauri.conf.json, which it is) to emit the updater archive next to
      # the regular .dmg:
      #
      #   target/universal-apple-darwin/release/bundle/macos/Pouch.app.tar.gz
      #   target/universal-apple-darwin/release/bundle/macos/Pouch.app.tar.gz.sig
      #
      # The .sig content (a minisign signature line) is later embedded into
      # latest.json by the release job so the in-app updater can verify the
      # download before applying it.
      # ----------------------------------------------------------------------
      - name: Build Tauri app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validate macOS app bundle version metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          INFO_PLIST="src-tauri/target/universal-apple-darwin/release/bundle/macos/Pouch.app/Contents/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Missing generated app bundle Info.plist at $INFO_PLIST"
            exit 1
          fi

          SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$INFO_PLIST")"
          BUNDLE_VERSION="$(plutil -extract CFBundleVersion raw -o - "$INFO_PLIST")"

          if [ "$SHORT_VERSION" != "$VERSION" ]; then
            echo "::error::CFBundleShortVersionString ($SHORT_VERSION) does not match tag version $VERSION"
            exit 1
          fi
          if [ "$BUNDLE_VERSION" != "$VERSION" ]; then
            echo "::error::CFBundleVersion ($BUNDLE_VERSION) does not match tag version $VERSION"
            exit 1
          fi

          echo "Generated Info.plist version metadata matches $REF_NAME."

      # ----------------------------------------------------------------------
      # Debug: dump the bundler output tree so the first CI run records the
      # exact updater artifact filenames Tauri v2 produced (.app.tar.gz +
      # .app.tar.gz.sig, expected). Cheap to keep and invaluable if a future
      # tauri-action bump renames things.
      # ----------------------------------------------------------------------
      - name: List macOS bundler output (debug)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 4 -printf '%p\t%s bytes\n' 2>/dev/null \
            || find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 4 -exec ls -la {} +

      # ----------------------------------------------------------------------
      # Rename the .dmg and the updater archive (.app.tar.gz + .sig) to embed
      # the tag so rc / beta artifacts don't collide with the matching final
      # release (tauri-action defaults to names like
      # `Pouch_1.0.0_universal.dmg` / `Pouch.app.tar.gz` based on
      # tauri.conf.json's productName + version, which are identical for
      # v1.0.0-rc1 and v1.0.0). On workflow_dispatch from a non-tag ref we
      # fall back to the raw ref_name so the upload still works.
      #
      # We stage everything into a single ./artifacts/ directory at repo
      # root so upload-artifact can glob one path (and so the release job
      # downloading us sees a flat layout consistent with the Windows job).
      # ----------------------------------------------------------------------
      - name: Stage and rename macOS artifacts with tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # `v1.0.0-rc1` -> `1.0.0-rc1`; for non-tag dispatches just use the
          # ref name verbatim (no leading `v` to strip).
          REF_NAME="${GITHUB_REF##*/}"
          VERSION="${REF_NAME#v}"

          mkdir -p artifacts
          shopt -s nullglob

          # Signed + notarized .dmg.
          dmg_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          dmg_found=0
          for f in "$dmg_dir"/*.dmg; do
            cp -f -- "$f" "artifacts/Pouch-${VERSION}.dmg"
            dmg_found=1
          done
          if [[ "$dmg_found" -eq 0 ]]; then
            echo "::error::No .dmg produced under $dmg_dir"
            exit 1
          fi

          # Updater archive produced when bundle.createUpdaterArtifacts is
          # true and TAURI_SIGNING_PRIVATE_KEY is set.
          macos_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          tar_found=0
          for f in "$macos_dir"/*.app.tar.gz; do
            cp -f -- "$f" "artifacts/Pouch-${VERSION}.app.tar.gz"
            tar_found=1
          done
          if [[ "$tar_found" -eq 0 ]]; then
            echo "::error::No .app.tar.gz produced under $macos_dir -- is TAURI_SIGNING_PRIVATE_KEY set and bundle.createUpdaterArtifacts=true?"
            exit 1
          fi

          sig_found=0
          for f in "$macos_dir"/*.app.tar.gz.sig; do
            cp -f -- "$f" "artifacts/Pouch-${VERSION}.app.tar.gz.sig"
            sig_found=1
          done
          if [[ "$sig_found" -eq 0 ]]; then
            echo "::error::No .app.tar.gz.sig produced under $macos_dir"
            exit 1
          fi

          ls -la artifacts

      # ----------------------------------------------------------------------
      # Stash the .dmg + updater archive (.app.tar.gz + .sig) for the
      # release job. We only ship the .dmg + updater pair (not the .app
      # bundle next to them) because that's what end users / the in-app
      # updater download. `if-no-files-found: error` makes a misconfigured
      # bundler step fail loudly instead of producing an empty release.
      # ----------------------------------------------------------------------
      - name: Upload macOS artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: |
            artifacts/Pouch-*.dmg
            artifacts/Pouch-*.app.tar.gz
            artifacts/Pouch-*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows build: portable .exe + zipped sample bundle, NO installer.
  # We bypass `tauri build` and call cargo directly because the only thing we
  # want from the Tauri toolchain on Windows is the linked binary -- no
  # WiX/NSIS bundling, no signing, no install metadata. Windows users install
  # Pouch through Scoop or by downloading the portable .exe / .zip; auto-
  # update is macOS-only (see updater.rs).
  #
  # Two modes, gated by the trigger:
  #   - main / PR  -> fast `cargo check` smoke test only (no release build,
  #                   no zip staging, no upload).
  #   - v* tag / workflow_dispatch -> full release path: `cargo build
  #                   --release`, stage portable .exe + .zip, upload.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (portable .exe + .zip)
    needs: [validate_release_version]
    if: ${{ always() && !cancelled() && (needs.validate_release_version.result == 'success' || needs.validate_release_version.result == 'skipped') }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ----------------------------------------------------------------------
      # SMOKE-ONLY: `cargo check` on main push / PR. No release build, no
      # bundle staging.
      # ----------------------------------------------------------------------
      - name: Cargo check (smoke)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        working-directory: src-tauri
        run: cargo check --locked

      # ----------------------------------------------------------------------
      # Build the binary directly with cargo. The Tauri runtime bits compile
      # the same way they would under `tauri build`; we just skip the
      # bundler. cwd is `src-tauri/` because that's where Cargo.toml lives.
      # ----------------------------------------------------------------------
      - name: Cargo build (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: src-tauri
        run: cargo build --release

      # ----------------------------------------------------------------------
      # Stage the artifacts. PowerShell because Windows runners default to it
      # and it gives us native `Compress-Archive` without extra tooling.
      #
      # Naming uses the tag (rc / beta tags survive intact so they never
      # clobber the final-release artifacts). `v1.0.0-rc1` -> version
      # `1.0.0-rc1`; on workflow_dispatch from a non-tag ref we use the raw
      # ref name (which has no leading `v` to strip).
      #
      # Layout produced inside ./artifacts:
      #   Pouch-<version>.exe
      #   Pouch-<version>.zip   (contains pouch.exe + config + inject/)
      #
      # The zip's inner layout intentionally puts files at the archive root
      # so a user can unzip-and-run.
      # ----------------------------------------------------------------------
      - name: Stage Windows artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $crate = 'pouch'

          # Tag-derived version. `GITHUB_REF_NAME` is `v1.0.0-rc1` for tag
          # pushes and the branch name for workflow_dispatch on a branch.
          $refName = $env:GITHUB_REF_NAME
          if ($refName.StartsWith('v')) {
            $version = $refName.Substring(1)
          } else {
            $version = $refName
          }
          $assetBase = "Pouch-$version"

          $repoRoot = $env:GITHUB_WORKSPACE
          $exeSrc = Join-Path $repoRoot 'src-tauri/target/release' "$crate.exe"
          if (-not (Test-Path $exeSrc)) {
            throw "Expected built binary not found: $exeSrc"
          }

          # Staging directory whose contents become the zip's root entries.
          $stage = Join-Path $repoRoot "stage-$assetBase"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Copy the binary under its plain (unsuffixed) name -- that's what
          # users will see after extracting the zip.
          Copy-Item $exeSrc (Join-Path $stage "$crate.exe")

          # Sample config + inject scripts live at the project root.
          Copy-Item (Join-Path $repoRoot 'hook.conf.toml') $stage
          Copy-Item (Join-Path $repoRoot 'inject') $stage -Recurse

          # NOTE: overrides/ is intentionally not copied; it holds runtime
          # cached resources and would leak local dev state into a release.

          # Final artifacts directory.
          $out = Join-Path $repoRoot 'artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # Zip the staged tree (contents-of-stage, not stage itself).
          $zipPath = Join-Path $out "$assetBase.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath

          # Also publish the bare .exe under the same tag-bearing name for
          # users who don't need the sample inject/ tree.
          Copy-Item $exeSrc (Join-Path $out "$assetBase.exe")

          Write-Host 'Windows artifacts staged:'
          Get-ChildItem $out | ForEach-Object { Write-Host (' - ' + $_.FullName) }

      - name: Upload Windows artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            artifacts/Pouch-*.exe
            artifacts/Pouch-*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release job: runs on `v*` tag pushes and on workflow_dispatch, after both
  # builds succeed. Uses ubuntu-latest because all it does is download
  # artifacts and publish a release -- no platform-specific tooling needed
  # (saves macOS minutes).
  #
  # On workflow_dispatch (manual rebuild against a non-tag ref) the
  # softprops/action-gh-release step still needs a tag to attach to. If the
  # dispatch is launched from a non-tag ref, the publish step is skipped and
  # only the artifacts are produced.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # No checkout needed -- we're not reading repo files, just artifacts.
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # `merge-multiple: true` flattens artifact-name subdirs so all
          # files land directly under ./artifacts. With our two artifact
          # names this leaves us with the macOS .dmg + updater archive and
          # the Windows .exe + .zip side by side.
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts

      # ----------------------------------------------------------------------
      # Generate the updater manifest the in-app Tauri updater polls.
      # tauri.conf.json points `plugins.updater.endpoints` at:
      #
      #   https://github.com/leaker/pouch/releases/latest/download/latest.json
      #
      # so the manifest must live as a release asset named `latest.json`. We
      # build it here from the .sig file that the macOS bundler emitted next
      # to the updater payload, then attach it to the release in the next
      # step.
      #
      # Notes on the platform keys:
      #   - darwin-universal / darwin-aarch64 / darwin-x86_64 all point at
      #     the same universal-apple-darwin .app.tar.gz. Tauri's universal
      #     binary contains both architectures, so a single artifact serves
      #     every Mac. Listing the three keys is what the Tauri docs
      #     recommend for forward-compat with installers that resolve the
      #     exact host arch.
      #   - No Windows entry: Pouch does not ship a Windows installer, so
      #     auto-update is macOS-only. Windows users upgrade through
      #     `scoop update pouch` or by downloading a fresh portable build.
      # ----------------------------------------------------------------------
      - name: Generate latest.json for updater
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          DARWIN_SIG_FILE="artifacts/Pouch-${VERSION}.app.tar.gz.sig"

          if [[ ! -f "$DARWIN_SIG_FILE" ]]; then
            echo "::error::Missing $DARWIN_SIG_FILE -- did the macOS job emit the updater archive?"
            exit 1
          fi

          DARWIN_SIG=$(cat "$DARWIN_SIG_FILE")
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > artifacts/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/leaker/pouch/releases/tag/${REF_NAME}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-universal": {
                "signature": "${DARWIN_SIG}",
                "url": "https://github.com/leaker/pouch/releases/download/${REF_NAME}/Pouch-${VERSION}.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "${DARWIN_SIG}",
                "url": "https://github.com/leaker/pouch/releases/download/${REF_NAME}/Pouch-${VERSION}.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${DARWIN_SIG}",
                "url": "https://github.com/leaker/pouch/releases/download/${REF_NAME}/Pouch-${VERSION}.app.tar.gz"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat artifacts/latest.json

      # `prerelease` is computed from the tag name so any `-rc`, `-beta`, or
      # `-alpha` suffix lands as a GitHub prerelease. This keeps brew's
      # livecheck and scoop's checkver from picking rc / beta tags as
      # "latest stable", and it also gates the bump-package-managers workflow
      # which skips on `github.event.release.prerelease`. SemVer-style
      # `v1.2.3` (no suffix) stays a normal release; we deliberately do NOT
      # match the generic `-` form so a future `-hotfix` tag wouldn't be
      # mistakenly demoted.
      # The `body:` field below is prepended to the auto-generated changelog.
      # softprops/action-gh-release concatenates them as
      # `${body}\n\n${generated_notes}` when both `body:` and
      # `generate_release_notes: true` are set, so the install guidance lands
      # above GitHub's "What's Changed" / "Full Changelog" section on the
      # release page. Keep this template in sync with the README "Install"
      # section so first-time visitors get the same SmartScreen heads-up
      # whether they land on the release page or the README.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            **macOS:** `brew install --cask leaker/tap/pouch` (or download `Pouch-*.dmg` below)

            **Windows:** `scoop bucket add leaker https://github.com/leaker/scoop-bucket && scoop install pouch` (or download `Pouch-*.exe` / `Pouch-*.zip` below)

            See the [README](https://github.com/leaker/pouch#install) for full instructions.

            ## Asset guide

            **For users — pick one:**
            - `*.dmg` — macOS universal installer (signed and notarized)
            - `*.exe` / `*.zip` — Windows portable

            **For Pouch's built-in updater (ignore unless curious):**
            - `*.app.tar.gz` + `.sig` — macOS update payload
            - `latest.json` — updater channel manifest (macOS only)

            ---
          files: |
            artifacts/Pouch-*.dmg
            artifacts/Pouch-*.app.tar.gz
            artifacts/Pouch-*.app.tar.gz.sig
            artifacts/Pouch-*.exe
            artifacts/Pouch-*.zip
            artifacts/latest.json

      # ----------------------------------------------------------------------
      # Package manager manifest bump.
      #
      # This runs inside the same release job, after softprops/action-gh-release
      # has finished uploading the .dmg / .zip assets. We hash the already
      # downloaded local artifacts instead of re-downloading them from the
      # GitHub Release, then push downstream manifest updates with the
      # cross-repo PACKAGE_MANAGER_BUMP_TOKEN.
      #
      # Pre-release tags (`-rc`, `-beta`, `-alpha`) intentionally skip this
      # stable-channel bump, matching the Release prerelease classification
      # above.
      # ----------------------------------------------------------------------
      - name: Validate package manager bump token
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        env:
          PACKAGE_MANAGER_BUMP_TOKEN: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGE_MANAGER_BUMP_TOKEN" ]; then
            echo "::error::PACKAGE_MANAGER_BUMP_TOKEN is required to push Homebrew/Scoop manifest updates."
            exit 1
          fi

      - name: Compute package manager sha256 values
        id: package_sha
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          DMG_PATH="artifacts/Pouch-${VERSION}.dmg"
          ZIP_PATH="artifacts/Pouch-${VERSION}.zip"

          if [ ! -f "$DMG_PATH" ]; then
            echo "::error::Missing $DMG_PATH"
            exit 1
          fi
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Missing $ZIP_PATH"
            exit 1
          fi

          DMG_SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          ZIP_SHA=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          {
            echo "version=$VERSION"
            echo "dmg_sha256=$DMG_SHA"
            echo "zip_sha256=$ZIP_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "dmg sha256: $DMG_SHA"
          echo "zip sha256: $ZIP_SHA"

      - name: Checkout homebrew-tap
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        uses: actions/checkout@v4
        with:
          repository: leaker/homebrew-tap
          token: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
          path: tap

      - name: Bump Cask
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        env:
          VERSION: ${{ steps.package_sha.outputs.version }}
          DMG_SHA: ${{ steps.package_sha.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          cd tap
          sed -i -E 's|^  version ".*"|  version "'"$VERSION"'"|' Casks/pouch.rb
          sed -i -E '0,/^  sha256 ".*"/{s|^  sha256 ".*"|  sha256 "'"$DMG_SHA"'"|}' Casks/pouch.rb
          if git diff --quiet; then
            echo "No changes to Cask -- version already at $VERSION."
            exit 0
          fi
          git diff Casks/pouch.rb

      - name: Commit & push homebrew-tap
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        env:
          VERSION: ${{ steps.package_sha.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            echo "No diff -- skipping commit."
            exit 0
          fi
          git -c user.name="leaker[bot]" -c user.email="claude@leelib.com" \
            commit -am "pouch: bump to ${VERSION}"
          git push origin HEAD:main

      - name: Checkout scoop-bucket
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        uses: actions/checkout@v4
        with:
          repository: leaker/scoop-bucket
          token: ${{ secrets.PACKAGE_MANAGER_BUMP_TOKEN }}
          path: bucket

      - name: Bump Scoop manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        env:
          VERSION: ${{ steps.package_sha.outputs.version }}
          ZIP_SHA: ${{ steps.package_sha.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          cd bucket
          python3 <<'PY'
          import json, os, pathlib
          v   = os.environ["VERSION"]
          sha = os.environ["ZIP_SHA"]
          p   = pathlib.Path("bucket/pouch.json")
          m   = json.loads(p.read_text())
          m["version"] = v
          arch = m["architecture"]["64bit"]
          arch["url"]  = f"https://github.com/leaker/pouch/releases/download/v{v}/Pouch-{v}.zip"
          arch["hash"] = sha
          p.write_text(json.dumps(m, indent=4) + "\n")
          PY
          if git diff --quiet; then
            echo "No changes to manifest -- version already at $VERSION."
            exit 0
          fi
          git diff bucket/pouch.json

      - name: Commit & push scoop-bucket
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
        env:
          VERSION: ${{ steps.package_sha.outputs.version }}
        run: |
          set -euo pipefail
          cd bucket
          if git diff --quiet; then
            echo "No diff -- skipping commit."
            exit 0
          fi
          git -c user.name="leaker[bot]" -c user.email="claude@leelib.com" \
            commit -am "pouch: bump to ${VERSION}"
          git push origin HEAD:main
