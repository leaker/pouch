# =============================================================================
# Cross-platform build workflow for Pouch (Tauri v2 desktop app).
#
# What this workflow does
# -----------------------
#   - On push to `main` and on pull_request targeting `main`:
#       run a fast `cargo check` on macOS (Apple Silicon) and Windows runners.
#       No bundling, no signing, no notarization, no artifact upload, no
#       Release. This is purely a "does the tree still compile?" smoke test.
#
#   - On push of a tag matching `v*` (e.g. `v0.1.0`, `v1.2.3-rc1`) OR on
#       manual `workflow_dispatch`:
#       run the full release path: macOS universal-darwin build via
#       tauri-action with sign + notarize + .dmg bundling, Windows
#       `cargo build --release` + portable .exe / .zip staging, then create
#       a GitHub Release uploading both via `softprops/action-gh-release` in
#       a dedicated `release` job that runs after both builds finish.
#       (workflow_dispatch from a non-tag ref still produces artifacts but
#       skips the GitHub Release publish step.)
#
# Artifacts (final shape)
# -----------------------
# All artifacts share one filename pattern: `Pouch-<version>.<ext>` where
# <version> is the git tag with the leading `v` stripped (so `v1.0.0-rc1`
# becomes `1.0.0-rc1`). This means rc / beta builds never collide with the
# matching final release on the same Releases page, and there is no
# platform suffix to confuse downloaders -- the file extension already
# tells the user which platform a given artifact is for.
#
#   - macOS  (macos-latest, universal-apple-darwin):
#       * `Pouch-<version>.dmg`
#         Signed with Developer ID Application + notarized by Apple's
#         notary service. Built by `tauri-apps/tauri-action` under its
#         default `Pouch_<version>_universal.dmg` name and renamed to the
#         tag-bearing form by the workflow before upload-artifact.
#
#   - Windows (windows-latest, x86_64-pc-windows-msvc):
#       * `Pouch-<version>.exe`
#         The raw portable binary copied from
#         `src-tauri/target/release/pouch.exe`.
#       * `Pouch-<version>.zip`
#         A self-contained sample bundle with the layout:
#             pouch.exe
#             hook.config.json
#             inject/
#                 global.js
#                 leelib.js
#         The `overrides/` directory (which holds runtime-cached
#         resources at dev/run time) is intentionally NOT included --
#         shipping that data could leak local development state.
#
# Why we bypass tauri-action on Windows
# -------------------------------------
# Tauri's Windows bundler defaults to `.msi` (and optionally NSIS `.exe`
# installer). For Pouch we want a *portable* `.exe` and a self-contained
# `.zip` -- not an installer. Running `cargo build --release` directly inside
# `src-tauri/` produces exactly that, with no bundling overhead. tauri-action
# remains the right tool for macOS where signing + notarization is
# non-trivial to reimplement by hand.
#
# x86_64-mac (standalone), iOS and Android are intentionally out of scope
# for Pouch (see README §7 for the supported platform matrix).
#
# macOS code signing + notarization
# ---------------------------------
# We import an Apple Developer ID certificate into a temporary keychain on the
# runner before invoking tauri-action, then pass the Apple credentials through
# the environment so tauri-action notarizes the resulting .app/.dmg with
# Apple's notary service. Windows is *not* signed by this workflow.
#
# Required GitHub Secrets (Repo -> Settings -> Secrets and variables ->
# Actions -> New repository secret). The workflow will skip the macOS signing
# step gracefully if `APPLE_CERTIFICATE` is empty (e.g. on a fork's PR), but
# release builds without these secrets will produce unsigned artifacts that
# Gatekeeper will quarantine on end-user machines.
#
#   APPLE_CERTIFICATE
#       Base64-encoded .p12 file containing your "Developer ID Application"
#       certificate AND its private key. Export from Keychain Access ->
#       My Certificates, then:  base64 -i cert.p12 | pbcopy   (macOS)
#       Paste the resulting single-line string as the secret value.
#
#   APPLE_CERTIFICATE_PASSWORD
#       The password you set when exporting the .p12 above. Used by `security
#       import` to unlock the certificate.
#
#   APPLE_SIGNING_IDENTITY
#       The exact name of the codesigning identity, e.g.
#           "Developer ID Application: Jane Doe (ABCDE12345)"
#       Run `security find-identity -v -p codesigning` locally to copy it.
#       Tauri matches this string against the keychain to pick the cert.
#
#   APPLE_ID
#       Your Apple ID email address (the one enrolled in the Developer
#       Program). Used by the notary service for authentication.
#
#   APPLE_PASSWORD
#       An *app-specific password* generated at https://appleid.apple.com ->
#       Sign-In and Security -> App-Specific Passwords.  NOT your Apple ID
#       login password. Notarization will fail with a non-obvious 401 if you
#       use the regular password.
#
#   APPLE_TEAM_ID
#       Your 10-character Team ID (e.g. `ABCDE12345`), found at
#       https://developer.apple.com/account -> Membership. Required when
#       your Apple ID belongs to multiple teams; safe to always set.
#
#   KEYCHAIN_PASSWORD
#       Any random throwaway string. Used only to lock/unlock the temporary
#       build keychain we create on the runner; it never leaves the job.
#
# Tooling versions are pinned to current stable major tags. Bump deliberately.
# =============================================================================

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only at the workflow level; the `release` job opts back in
# to `contents: write` when it needs to publish a Release.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # macOS build.
  #
  # Two modes, gated by the trigger:
  #   - main / PR  -> fast `cargo check` smoke test only (no bundle, no sign,
  #                   no notarize, no upload). Just confirms the tree compiles
  #                   on Apple Silicon.
  #   - v* tag / workflow_dispatch -> full release path: signed + notarized
  #                   .dmg via tauri-action, then upload-artifact for the
  #                   release job to pick up.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    # Hoist the cert secret to job-level env so the keychain step's `if:`
    # expression can detect when it's empty (forked PRs cannot read secrets,
    # and `secrets.*` is not allowed inside `if:`).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 Apple Darwin target
        # Only needed for the `--target universal-apple-darwin` release build.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache cargo registry/git AND the per-crate target directory.
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ----------------------------------------------------------------------
      # SMOKE-ONLY: `cargo check` on main push / PR. No bundling.
      # ----------------------------------------------------------------------
      - name: Cargo check (smoke)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        working-directory: src-tauri
        run: cargo check --locked

      # ----------------------------------------------------------------------
      # Import the Developer ID certificate into a fresh keychain so codesign
      # can find it during `tauri build`. Release-only.
      # ----------------------------------------------------------------------
      - name: Import Apple Developer certificate
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      # ----------------------------------------------------------------------
      # Build (and sign + notarize when secrets are present). tauri-action
      # handles bundling, signing (via APPLE_* env), and notarization. We do
      # NOT pass tagName/releaseName/releaseBody here -- the dedicated
      # `release` job below collects artifacts from upload-artifact and
      # publishes them in a single coordinated step.
      # ----------------------------------------------------------------------
      - name: Build Tauri app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ----------------------------------------------------------------------
      # Rename the .dmg to embed the tag so rc / beta artifacts don't collide
      # with the matching final release (tauri-action defaults to a name like
      # `Pouch_1.0.0_universal.dmg` based on tauri.conf.json's productName +
      # version, which is identical for v1.0.0-rc1 and v1.0.0). On
      # workflow_dispatch from a non-tag ref we fall back to the raw
      # ref_name so the upload still works.
      # ----------------------------------------------------------------------
      - name: Rename macOS artifact with tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: |
          set -euo pipefail
          # `v1.0.0-rc1` -> `1.0.0-rc1`; for non-tag dispatches just use the
          # ref name verbatim (no leading `v` to strip).
          REF_NAME="${GITHUB_REF##*/}"
          VERSION="${REF_NAME#v}"
          shopt -s nullglob
          for f in *.dmg; do
            if [[ "$f" == "Pouch-${VERSION}.dmg" ]]; then
              continue
            fi
            mv -- "$f" "Pouch-${VERSION}.dmg"
          done
          ls -la

      # ----------------------------------------------------------------------
      # Stash the .dmg for the release job. We only ship the .dmg (not the
      # .app bundle next to it) because that's what end users download.
      # `if-no-files-found: error` makes a misconfigured bundler step fail
      # loudly instead of producing an empty release.
      # ----------------------------------------------------------------------
      - name: Upload macOS artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Pouch-*.dmg
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows build: portable .exe + zipped sample bundle, NO installer.
  # We bypass `tauri build` and call cargo directly because the only thing we
  # want from the Tauri toolchain on Windows is the linked binary -- no
  # WiX/NSIS bundling, no signing, no install metadata.
  #
  # Two modes, gated by the trigger:
  #   - main / PR  -> fast `cargo check` smoke test only (no release build,
  #                   no zip staging, no upload).
  #   - v* tag / workflow_dispatch -> full release path: `cargo build
  #                   --release`, stage portable .exe + .zip, upload.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (portable .exe + .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ----------------------------------------------------------------------
      # SMOKE-ONLY: `cargo check` on main push / PR. No release build, no
      # bundle staging.
      # ----------------------------------------------------------------------
      - name: Cargo check (smoke)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        working-directory: src-tauri
        run: cargo check --locked

      # ----------------------------------------------------------------------
      # Build the binary directly with cargo. The Tauri runtime bits compile
      # the same way they would under `tauri build`; we just skip the
      # bundler. cwd is `src-tauri/` because that's where Cargo.toml lives.
      # ----------------------------------------------------------------------
      - name: Cargo build (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: src-tauri
        run: cargo build --release

      # ----------------------------------------------------------------------
      # Stage the artifacts. PowerShell because Windows runners default to it
      # and it gives us native `Compress-Archive` without extra tooling.
      #
      # Naming uses the tag (rc / beta tags survive intact so they never
      # clobber the final-release artifacts). `v1.0.0-rc1` -> version
      # `1.0.0-rc1`; on workflow_dispatch from a non-tag ref we use the raw
      # ref name (which has no leading `v` to strip).
      #
      # Layout produced inside ./artifacts:
      #   Pouch-<version>.exe
      #   Pouch-<version>.zip   (contains pouch.exe + config + inject/)
      #
      # The zip's inner layout intentionally puts files at the archive root
      # so a user can unzip-and-run.
      # ----------------------------------------------------------------------
      - name: Stage Windows artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $crate = 'pouch'

          # Tag-derived version. `GITHUB_REF_NAME` is `v1.0.0-rc1` for tag
          # pushes and the branch name for workflow_dispatch on a branch.
          $refName = $env:GITHUB_REF_NAME
          if ($refName.StartsWith('v')) {
            $version = $refName.Substring(1)
          } else {
            $version = $refName
          }
          $assetBase = "Pouch-$version"

          $repoRoot = $env:GITHUB_WORKSPACE
          $exeSrc = Join-Path $repoRoot 'src-tauri/target/release' "$crate.exe"
          if (-not (Test-Path $exeSrc)) {
            throw "Expected built binary not found: $exeSrc"
          }

          # Staging directory whose contents become the zip's root entries.
          $stage = Join-Path $repoRoot "stage-$assetBase"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Copy the binary under its plain (unsuffixed) name -- that's what
          # users will see after extracting the zip.
          Copy-Item $exeSrc (Join-Path $stage "$crate.exe")

          # Sample config + inject scripts live at the project root.
          Copy-Item (Join-Path $repoRoot 'hook.config.json') $stage
          Copy-Item (Join-Path $repoRoot 'inject') $stage -Recurse

          # NOTE: overrides/ is intentionally not copied; it holds runtime
          # cached resources and would leak local dev state into a release.

          # Final artifacts directory.
          $out = Join-Path $repoRoot 'artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # Zip the staged tree (contents-of-stage, not stage itself).
          $zipPath = Join-Path $out "$assetBase.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath

          # Also publish the bare .exe under the same tag-bearing name for
          # users who don't need the sample inject/ tree.
          Copy-Item $exeSrc (Join-Path $out "$assetBase.exe")

          Write-Host 'Windows artifacts staged:'
          Get-ChildItem $out | ForEach-Object { Write-Host (' - ' + $_.FullName) }

      - name: Upload Windows artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            artifacts/Pouch-*.exe
            artifacts/Pouch-*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release job: runs on `v*` tag pushes and on workflow_dispatch, after both
  # builds succeed. Uses ubuntu-latest because all it does is download
  # artifacts and publish a release -- no platform-specific tooling needed
  # (saves macOS minutes).
  #
  # On workflow_dispatch (manual rebuild against a non-tag ref) the
  # softprops/action-gh-release step still needs a tag to attach to. If the
  # dispatch is launched from a non-tag ref, the publish step is skipped and
  # only the artifacts are produced.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # No checkout needed -- we're not reading repo files, just artifacts.
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # `merge-multiple: true` flattens artifact-name subdirs so all
          # files land directly under ./artifacts. With our two artifact
          # names this leaves us with the .dmg, .exe, and .zip side by side.
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.zip
