[package]
name = "pouch"
version = "2.0.1"
description = "macOS/Windows webview hook tool with on-disk caching, JS injection, and configurable URL filtering"
authors = ["leaker"]
license = "MIT"
repository = "https://github.com/leaker/pouch"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pouch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# User-config file format (`hook.conf.toml`). Already in the lockfile via
# `tauri-build` → `cargo-platform` → `toml`, so promoting it to a direct
# dep adds no extra compilation; only changes which crate "owns" the edge
# in the dep graph.
toml = "0.8"
tokio = { version = "1", features = ["fs", "sync", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "gzip", "brotli", "deflate", "cookies"] }
regex = "1"
tempfile = "3"
percent-encoding = "2"
url = "2"
http = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Embedded SQLite for unified state persistence (storage.db — window state +
# recent URLs in a single KV table). `bundled` compiles SQLite C source into
# the binary so we don't depend on the system libsqlite3 version (~700KB).
rusqlite = { version = "0.31", features = ["bundled"] }

# Windows-specific deps for the WebView2 native interceptor (phase H).
# Versions aligned with what wry / tauri 2.x already pull in via the current
# Cargo.lock to avoid multiple-versions conflicts.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# `Win32_UI_Shell` is required for `SHCreateMemStream` (used by phase H to
# build response IStreams from owned `Vec<u8>` bodies — see hook/platform/windows.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-core = "0.61"

# macOS-specific deps. The legacy NSURLProtocol-based interceptor was
# removed once the MITM proxy reached parity, so the `objc2-web-kit` /
# `block2` / `dispatch2` deps it pulled in are no longer needed; the
# remaining objc2-* crates serve dialog / titlebar / mitm trust UI on AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# Used for dialog.rs / titlebar.rs / mitm/trust.rs entry points (NSAlert,
# NSTitlebarAccessoryViewController, etc). Version aligned with wry's
# transitive `objc2-app-kit 0.3.2` (see Cargo.lock — we add as a direct dep
# so the explicit feature set below is always satisfied even if upstream
# tao/wry stops requiring it transitively).
objc2-app-kit = { version = "0.3", features = [
    "NSButton",
    "NSCell",
    "NSComboBox",
    "NSImage",
    "NSProgressIndicator",
    "NSResponder",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSTitlebarAccessoryViewController",
    "NSLayoutConstraint",
] }
# MITM proxy (mitm/ module). hudsucker = HTTP/S MITM core (CONNECT
# parsing + per-host leaf cert generation via rcgen). We explicitly pick
# `decoder + http2 + native-tls-client + rcgen-ca + rustls-client` instead of
# the `full` feature because `full` also enables `openssl-ca`, which pulls in
# `openssl-sys` / system openssl. That breaks the universal-apple-darwin CI
# build: cross-compiling x86_64-apple-darwin from an aarch64-apple-darwin host
# fails openssl pkg-config probing ($HOST != $TARGET). pouch signs the CA via
# rcgen and never uses hudsucker's openssl-ca path, so the openssl dep is dead
# code. macOS-only — Windows uses WebView2's WebResourceRequested API natively
# (see hook/platform/windows.rs).
hudsucker = { version = "0.24", default-features = false, features = [
    "decoder",
    "http2",
    "native-tls-client",
    "rcgen-ca",
    "rustls-client",
] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
# The aws_lc_rs CryptoProvider feature must be enabled on rustls so we can
# call `rustls::crypto::aws_lc_rs::default_provider()`. Cargo unifies features
# across the dep tree, but reqwest still configures its own ring-based
# provider per-client, so the two coexist without conflict.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# Promote three transitive deps of `hudsucker` (already in the lockfile via the
# `full` feature) to direct deps so we can build a custom native-tls upstream
# connector that works around hudsucker 0.24.1's `with_native_tls_connector()`
# bug — that builder calls `HttpConnector::new()` without `enforce_http(false)`,
# so every https URL is rejected by the inner http connector with "invalid URL,
# scheme is not http". Versions pinned to whatever hudsucker `full` already
# resolved (Cargo.lock); this only changes which crate "owns" the edge in the
# dep graph, no extra compilation. Using the OS-native TLS stack lets us reach
# legacy game / WebSocket endpoints whose TLS configuration rustls (with its
# stricter defaults) refuses.
hyper-tls = { version = "0.6", features = ["alpn"] }
hyper-util = { version = "0.1", features = ["client-legacy"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
# Used by mitm/handler.rs to collect hudsucker's response Body into bytes for
# cache write-through (`BodyExt::collect`). Already in the lockfile via
# hudsucker's transitive deps; promoting to a direct edge for clarity.
http-body-util = "0.1"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
