[package]
name = "pouch"
version = "0.0.1"
description = "Pouch — desktop wrapper that hooks any web app's URL traffic into a local cache and runs custom JS at runtime"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pouch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
regex = "1"
once_cell = "1"
tempfile = "3"
percent-encoding = "2"
url = "2"
http = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Windows-specific deps for the WebView2 native interceptor (phase H).
# Versions aligned with what wry / tauri 2.x already pull in via the current
# Cargo.lock to avoid multiple-versions conflicts.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# `Win32_UI_Shell` is required for `SHCreateMemStream` (used by phase H to
# build response IStreams from owned `Vec<u8>` bodies — see hook/platform/windows.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-core = "0.61"

# macOS-specific deps for the WKWebView/NSURLProtocol native interceptor
# (phase I). Versions aligned with wry's transitive lockfile (see cargo tree).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
# Used by the macOS interceptor to hop NSURLProtocolClient callbacks back onto
# the main thread (`DispatchQueue::main().exec_async(...)`). Pinned to the same
# version wry transitively pulls in (see `cargo tree | grep dispatch2`).
dispatch2 = "0.3"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
