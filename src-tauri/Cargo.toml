[package]
name = "pouch"
version = "1.0.0"
description = "macOS/Windows webview hook tool with on-disk caching, JS injection, and configurable URL filtering"
authors = ["leaker"]
license = "MIT"
repository = "https://github.com/leaker/pouch"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pouch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "cookies"] }
regex = "1"
tempfile = "3"
percent-encoding = "2"
url = "2"
http = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Embedded SQLite for unified state persistence (storage.db — window state +
# recent URLs in a single KV table). `bundled` compiles SQLite C source into
# the binary so we don't depend on the system libsqlite3 version (~700KB).
rusqlite = { version = "0.31", features = ["bundled"] }

# Windows-specific deps for the WebView2 native interceptor (phase H).
# Versions aligned with what wry / tauri 2.x already pull in via the current
# Cargo.lock to avoid multiple-versions conflicts.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# `Win32_UI_Shell` is required for `SHCreateMemStream` (used by phase H to
# build response IStreams from owned `Vec<u8>` bodies — see hook/platform/windows.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-core = "0.61"

# macOS-specific deps for the WKWebView/NSURLProtocol native interceptor
# (phase I). Versions aligned with wry's transitive lockfile (see cargo tree).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
# Used for the Cmd+Shift+O / titlebar-button "Reveal Pouch Folder in Finder"
# entry points on macOS. Version aligned with wry's transitive
# `objc2-app-kit 0.3.2` (see Cargo.lock — we add as a direct dep so the
# explicit feature set below is always satisfied even if upstream tao/wry
# stops requiring it transitively).
objc2-app-kit = { version = "0.3", features = [
    "NSButton",
    "NSCell",
    "NSComboBox",
    "NSImage",
    "NSProgressIndicator",
    "NSResponder",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSTitlebarAccessoryViewController",
    "NSLayoutConstraint",
] }
block2 = "0.6"
# Used by the macOS interceptor to hop NSURLProtocolClient callbacks back onto
# the main thread (`DispatchQueue::main().exec_async(...)`). Pinned to the same
# version wry transitively pulls in (see `cargo tree | grep dispatch2`).
dispatch2 = "0.3"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
